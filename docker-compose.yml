version: "3.8"

services:
  fleet-management:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LISTEN_ADDR=:8080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DATABASE_PATH=/data/fleet.db
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - fleet-data:/data
    restart: unless-stopped

volumes:
  fleet-data:
