<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        .terminal {
            width: 100%;
            height: 100%;
        }
        .metric-value {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto p-4">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold">Fleet Management Dashboard</h1>
            <button id="generate-token" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">+ Generate New Node</button>
        </div>
        
        <!-- Tab Navigation -->
        <div class="flex border-b border-gray-700 mb-4">
            <button id="tab-nodes" class="tab-btn active border-b-2 border-blue-600 text-blue-400">Nodes</button>
            <button id="tab-dns" class="tab-btn border-b-2 border-transparent text-gray-400">DNS & ACME</button>
            <button id="tab-routes" class="tab-btn border-b-2 border-transparent text-gray-400">Proxy Routes</button>
            <button id="tab-stacks" class="tab-btn border-b-2 border-transparent text-gray-400">Docker Compose</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="nodes-container"></div>
    </div>

    <!-- Terminal Modal -->
    <div id="terminal-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 p-4 rounded-lg w-3/4 h-3/4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xl font-bold">WebSSH Terminal</h2>
                <button id="close-terminal" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <div id="terminal" class="terminal"></div>
        </div>
    </div>

    <!-- DNS & ACME Modal -->
    <div id="dns-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 p-6 rounded-lg w-4/5 max-w-2xl h-auto">
            <h2 class="text-2xl font-bold mb-4">DNS Providers</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Provider Name</label>
                    <input id="dns-name" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="e.g., Cloudflare">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Provider Type</label>
                    <select id="dns-type" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-4">
                        <option value="cloudflare">Cloudflare</option>
                        <option value="route53">Route53</option>
                        <option value="digitalocean">DigitalOcean</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Credentials (JSON)</label>
                    <textarea id="dns-creds" rows="3" class="bg-gray-800 border border-gray-600 rounded w-full p-2 text-white mb-4"></textarea>
                </div>
                <button id="dns-add-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Add Provider</button>
            </div>
        </div>
    </div>

    <!-- Certificates Modal -->
    <div id="cert-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 p-6 rounded-lg w-4/5 max-w-2xl h-auto">
            <h2 class="text-2xl font-bold mb-4">Certificates</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Domain</label>
                    <input id="cert-domain" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">DNS Provider</label>
                    <select id="cert-provider" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-4">
                        <!-- Options populated dynamically -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">ACME Env</label>
                    <select id="cert-env" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-4">
                        <option value="">Auto</option>
                        <option value="staging">Staging</option>
                        <option value="production">Production</option>
                    </select>
                </div>
                <button id="cert-add-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded">Issue Certificate</button>
            </div>
        </div>
    </div>

    <!-- Proxy Routes Modal -->
    <div id="routes-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 p-6 rounded-lg w-4/5 max-w-2xl h-auto">
            <h2 class="text-2xl font-bold mb-4">Proxy Routes</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Node ID</label>
                    <input id="route-node" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="node-uuid">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Domain</label>
                    <input id="route-domain" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Upstream</label>
                    <input id="route-upstream" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="http://localhost:8080">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Certificate</label>
                    <select id="route-cert" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-4">
                        <!-- Options populated dynamically -->
                    </select>
                </div>
                <button id="route-add-btn" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded">Add Route</button>
            </div>
        </div>
    </div>

    <!-- Compose Stacks Modal -->
    <div id="stacks-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 p-6 rounded-lg w-4/5 max-w-3xl h-auto">
            <h2 class="text-2xl font-bold mb-4">Docker Compose Stacks</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Stack Name</label>
                    <input id="stack-name" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="my-stack">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">YAML Content</label>
                    <textarea id="stack-yaml" rows="5" class="bg-gray-800 border border-gray-600 rounded w-full p-2 text-white mb-4" style="height: 200px;"></textarea>
                </div>
                <button id="stack-deploy-btn" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded w-full">Deploy Stack</button>
            </div>
        </div>
    </div>

    <script>
        // Tab navigation
        const tabBtns = document.querySelectorAll('.tab-btn');
        const nodesContainer = document.getElementById('nodes-container');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active', 'border-blue-600', 'text-blue-400'));
                btn.classList.add('active', 'border-b-2', 'border-blue-600', 'text-blue-400');
                
                if (btn.id === 'tab-nodes') {
                    fetchNodes();
                } else if (btn.id === 'tab-dns') {
                    fetchDNSProviders();
                } else if (btn.id === 'tab-routes') {
                    fetchProxyRoutes();
                } else if (btn.id === 'tab-stacks') {
                    fetchComposeStacks();
                }
            });
        });

        // Node card template - fixed layout with proper metrics
        const nodeTemplate = (node) => {
            const statusColor = node.online ? 'bg-green-500' : 'bg-red-500';
            const cpuColor = node.online ? 'bg-blue-600' : 'bg-gray-500';
            const memColor = node.online ? 'bg-green-600' : 'bg-gray-500';
            const diskColor = node.online ? 'bg-yellow-600' : 'bg-gray-500';
            
            return `
                <div class="bg-gray-800 p-4 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-lg font-bold truncate" title="${node.hostname}">${node.hostname}</h2>
                        <span class="text-xs text-gray-500 truncate" title="${node.id}">${node.id.substring(0, 8)}...</span>
                    </div>
                    <div class="text-sm text-gray-400 mb-2">
                        ${node.os}/${node.arch}
                    </div>
                    <div class="flex items-center mb-2">
                        <span class="inline-block w-2 h-2 rounded-full mr-2 ${statusColor}"></span>
                        <span class="text-sm">${node.online ? 'Online' : 'Offline'}</span>
                    </div>
                    <div class="mb-3">
                        <div class="text-xs text-gray-400 mb-1">CPU</div>
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-blue-600 h-2 rounded-full transition-width" style="width: ${Math.min(node.cpuPercent, 100)}%"></div>
                        </div>
                        <span class="text-xs text-gray-300 metric-value">${node.cpuPercent.toFixed(1)}%</span>
                    </div>
                    <div class="mb-3">
                        <div class="text-xs text-gray-400 mb-1">Mem</div>
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-green-600 h-2 rounded-full transition-width" style="width: ${Math.min(node.memPercent, 100)}%"></div>
                        </div>
                        <span class="text-xs text-gray-300 metric-value">${node.memUsedMB}MB / ${node.memTotalMB}MB</span>
                    </div>
                    <div class="mb-3">
                        <div class="text-xs text-gray-400 mb-1">Disk</div>
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-yellow-600 h-2 rounded-full transition-width" style="width: ${Math.min((node.diskUsedGB / node.diskTotalGB) * 100, 100)}%"></div>
                        </div>
                        <span class="text-xs text-gray-300 metric-value">${node.diskUsedGB}GB / ${node.diskTotalGB}GB</span>
                    </div>
                    <div class="mb-3">
                        <div class="text-xs text-gray-400 mb-1">Tags</div>
                        <div class="flex flex-wrap gap-1">
                            ${node.tags && node.tags.length > 0 ? node.tags.map(t => `<span class="text-xxs bg-gray-600 rounded px-1 py-0.5">${t}</span>`).join('') : '<span class="text-gray-500">none</span>'}
                        </div>
                    </div>
                    <button class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-1 px-3 rounded text-sm w-full" onclick="openTerminal('${node.id}')">>_ WebSSH Terminal</button>
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1 px-3 rounded text-sm w-full mt-1" onclick="editNodeTags('${node.id}', '${JSON.stringify(node.tags || [])}')">Edit Tags</button>
                </div>
            `;
        };

        // Fetch nodes and update UI
        async function fetchNodes() {
            try {
                const response = await fetch('/api/v1/nodes');
                const nodes = await response.json();
                nodesContainer.innerHTML = '';

                for (const node of nodes) {
                    if (node.online) {
                        const metricsResponse = await fetch(`/api/v1/nodes/${node.id}/metrics`);
                        const metrics = await metricsResponse.json();
                        node.cpuPercent = metrics.cpuPercent;
                        node.memPercent = metrics.memPercent;
                        node.diskUsedGB = metrics.diskUsedGB;
                        node.diskTotalGB = metrics.diskTotalGB;
                        node.memUsedMB = metrics.memUsedMB;
                        node.memTotalMB = metrics.memTotalMB;
                    }
                    nodesContainer.innerHTML += nodeTemplate(node);
                }
            } catch (error) {
                console.error('Error fetching nodes:', error);
            }
        }

        // Generate new node token
        document.getElementById('generate-token').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/v1/tokens', { method: 'POST' });
                const data = await response.json();
                const command = `go run ./cmd/agent -server http://127.0.0.1:8080 -bootstrap ${data.bootstrap_token}`;
                alert(`New node command:\n\n${command}`);
            } catch (error) {
                console.error('Error generating token:', error);
            }
        });

        // Terminal functionality
        let terminal = null;
        let socket = null;

        function openTerminal(nodeId) {
            const modal = document.getElementById('terminal-modal');
            modal.classList.remove('hidden');

            if (!terminal) {
                terminal = new Terminal({
                    cursorBlink: true,
                    theme: {
                        background: '#1a1a1a',
                        foreground: '#ffffff'
                    }
                });
                const fitAddon = new FitAddon.FitAddon();
                terminal.loadAddon(fitAddon);
                terminal.open(document.getElementById('terminal'));
                fitAddon.fit();

                terminal.onData((data) => {
                    if (socket) {
                        socket.send(data);
                    }
                });
            }

            // Connect to WebSocket
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            socket = new WebSocket(`${protocol}//${host}/api/v1/nodes/${nodeId}/pty`);

            socket.onopen = () => {
                terminal.write('\r\nConnected to node terminal\r\n');
            };

            socket.onmessage = (event) => {
                terminal.write(event.data);
            };

            socket.onclose = () => {
                terminal.write('\r\nDisconnected from terminal\r\n');
            };
        }

        document.getElementById('close-terminal').addEventListener('click', () => {
            if (socket) {
                socket.close();
                socket = null;
            }
            document.getElementById('terminal-modal').classList.add('hidden');
        });

        // DNS Providers CRUD
        async function fetchDNSProviders() {
            try {
                const response = await fetch('/api/v1/dns-providers');
                const providers = await response.json();
                renderDNSProviders(providers);
            } catch (error) {
                console.error('Error fetching DNS providers:', error);
            }
        }

        function renderDNSProviders(providers) {
            // Render DNS providers UI
            console.log('DNS Providers:', providers);
        }

        // Edit node tags
        function editNodeTags(nodeId, currentTags) {
            const tagsInput = prompt('Enter tags separated by comma:', currentTags ? currentTags.join(', ') : '');
            if (tagsInput === null) return;
            
            const tags = tagsInput.split(',').map(t => t.trim()).filter(t => t.length > 0);
            
            fetch(`/api/v1/nodes/${nodeId}/tags`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tags })
            }).then(res => res.json()).then(data => {
                fetchNodes();
            }).catch(err => {
                console.error('Error updating tags:', err);
            });
        }

        // Keepalive config
        function toggleKeepalive(nodeId, enabled) {
            fetch(`/api/v1/nodes/${nodeId}/keepalive`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled })
            });
        }

        // Initial load
        fetchNodes();
        setInterval(fetchNodes, 3000);
    </script>
</body>
</html>
