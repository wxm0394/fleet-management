<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        .terminal {
            width: 100%;
            height: 100%;
        }
        .metric-value {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto p-4">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold">Fleet Management Dashboard</h1>
            <button id="generate-token" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">+ Generate New Node</button>
        </div>
        
        <!-- Tab Navigation -->
        <div class="flex border-b border-gray-700 mb-4 gap-6 px-2 pb-1">
            <button id="tab-nodes" class="tab-btn active border-b-2 border-blue-600 text-blue-400 font-medium pb-2 px-1">Nodes</button>
            <button id="tab-dns" class="tab-btn border-b-2 border-transparent text-gray-400 hover:text-gray-200 font-medium pb-2 px-1">DNS & ACME</button>
            <button id="tab-routes" class="tab-btn border-b-2 border-transparent text-gray-400 hover:text-gray-200 font-medium pb-2 px-1">Proxy Routes</button>
            <button id="tab-stacks" class="tab-btn border-b-2 border-transparent text-gray-400 hover:text-gray-200 font-medium pb-2 px-1">Docker Compose</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 py-2" id="nodes-container"></div>
    </div>

    <!-- Terminal Modal -->
    <div id="terminal-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 p-4 rounded-lg w-3/4 h-3/4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xl font-bold">WebSSH Terminal</h2>
                <button id="close-terminal" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            <div id="terminal" class="terminal"></div>
        </div>
    </div>

    <!-- DNS & ACME Modal -->
    <div id="dns-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 p-6 rounded-lg w-4/5 max-w-2xl h-auto">
            <h2 class="text-2xl font-bold mb-4">DNS Providers</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Provider Name</label>
                    <input id="dns-name" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="e.g., Cloudflare">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Provider Type</label>
                    <select id="dns-type" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-4">
                        <option value="cloudflare">Cloudflare</option>
                        <option value="route53">Route53</option>
                        <option value="digitalocean">DigitalOcean</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Credentials (JSON)</label>
                    <textarea id="dns-creds" rows="3" class="bg-gray-800 border border-gray-600 rounded w-full p-2 text-white mb-4"></textarea>
                </div>
                <button id="dns-add-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Add Provider</button>
            </div>
        </div>
    </div>

    <!-- Certificates Modal -->
    <div id="cert-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 p-6 rounded-lg w-4/5 max-w-2xl h-auto">
            <h2 class="text-2xl font-bold mb-4">Certificates</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Domain</label>
                    <input id="cert-domain" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">DNS Provider</label>
                    <select id="cert-provider" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-4">
                        <!-- Options populated dynamically -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">ACME Env</label>
                    <select id="cert-env" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-4">
                        <option value="">Auto</option>
                        <option value="staging">Staging</option>
                        <option value="production">Production</option>
                    </select>
                </div>
                <button id="cert-add-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded">Issue Certificate</button>
            </div>
        </div>
    </div>

    <!-- Proxy Routes Modal -->
    <div id="routes-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 p-6 rounded-lg w-4/5 max-w-2xl h-auto">
            <h2 class="text-2xl font-bold mb-4">Proxy Routes</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Node ID</label>
                    <input id="route-node" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="node-uuid">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Domain</label>
                    <input id="route-domain" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Upstream</label>
                    <input id="route-upstream" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="http://localhost:8080">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Certificate</label>
                    <select id="route-cert" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-4">
                        <!-- Options populated dynamically -->
                    </select>
                </div>
                <button id="route-add-btn" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded">Add Route</button>
            </div>
        </div>
    </div>

    <!-- Compose Stacks Modal -->
    <div id="stacks-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 p-6 rounded-lg w-4/5 max-w-3xl h-auto">
            <h2 class="text-2xl font-bold mb-4">Docker Compose Stacks</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Stack Name</label>
                    <input id="stack-name" type="text" class="bg-gray-700 border border-gray-600 rounded w-full p-2 text-white mb-2" placeholder="my-stack">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">YAML Content</label>
                    <textarea id="stack-yaml" rows="5" class="bg-gray-800 border border-gray-600 rounded w-full p-2 text-white mb-4" style="height: 200px;"></textarea>
                </div>
                <button id="stack-deploy-btn" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded w-full">Deploy Stack</button>
            </div>
        </div>
    </div>

    <script>
        // Admin Key storage and fetch wrapper
        let adminKey = sessionStorage.getItem('adminKey');

        function getAdminKey() {
            if (!adminKey) {
                const key = prompt('Please enter Admin Password:');
                if (key) {
                    adminKey = key;
                    sessionStorage.setItem('adminKey', adminKey);
                }
            }
            return adminKey;
        }

        async function apiFetch(url, options = {}) {
            const key = getAdminKey();
            const headers = {
                'Content-Type': 'application/json',
                ...(key ? { 'X-Admin-Key': key } : {}),
                ...(options.headers || {})
            };

            const response = await fetch(url, { ...options, headers });

            if (response.status === 401) {
                sessionStorage.removeItem('adminKey');
                adminKey = null;
                const newKey = prompt('Authentication failed (401). Please re-enter Admin Password:');
                if (newKey) {
                    adminKey = newKey;
                    sessionStorage.setItem('adminKey', adminKey);
                    return apiFetch(url, options);
                }
            }
            return response;
        }

        // Tab navigation
        const tabBtns = document.querySelectorAll('.tab-btn');
        const nodesContainer = document.getElementById('nodes-container');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active', 'border-blue-600', 'text-blue-400'));
                btn.classList.add('active', 'border-b-2', 'border-blue-600', 'text-blue-400');
                
                if (btn.id === 'tab-nodes') {
                    fetchNodes();
                } else if (btn.id === 'tab-dns') {
                    fetchDNSProviders();
                } else if (btn.id === 'tab-routes') {
                    fetchProxyRoutes();
                } else if (btn.id === 'tab-stacks') {
                    fetchComposeStacks();
                }
            });
        });

        // Node card template - fixed layout with proper metrics
        const nodeTemplate = (node) => {
            // Safely handle tags - node.tags could be string from JSON, array, or undefined
            let tagsHTML = '';
            if (node.tags && Array.isArray(node.tags) && node.tags.length > 0) {
                tagsHTML = node.tags.map(t => `<span class="text-xxs bg-gray-600 rounded px-1 py-0.5">${t}</span>`).join('');
            } else if (typeof node.tags === 'string' && node.tags.length > 0) {
                // Parse JSON string tags
                try {
                    const parsedTags = JSON.parse(node.tags);
                    if (Array.isArray(parsedTags) && parsedTags.length > 0) {
                        tagsHTML = parsedTags.map(t => `<span class="text-xxs bg-gray-600 rounded px-1 py-0.5">${t}</span>`).join('');
                    }
                } catch(e) {
                    // If parsing fails, show as plain string
                    tagsHTML = `<span class="text-xxs bg-gray-600 rounded px-1 py-0.5">${node.tags}</span>`;
                }
            } else {
                tagsHTML = '<span class="text-gray-500">none</span>';
            }
            
            const statusColor = node.online ? 'bg-green-500' : 'bg-red-500';
            const cpuColor = node.online ? 'bg-blue-600' : 'bg-gray-500';
            const memColor = node.online ? 'bg-green-600' : 'bg-gray-500';
            const diskColor = node.online ? 'bg-yellow-600' : 'bg-gray-500';
            
            return `
                <div class="bg-gray-800 p-4 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-lg font-bold truncate" title="${node.hostname}">${node.hostname}</h2>
                        <span class="text-xs text-gray-500 truncate" title="${node.id}">${node.id.substring(0, 8)}...</span>
                    </div>
                    <div class="text-sm text-gray-400 mb-2">
                        ${node.os}/${node.arch}
                    </div>
                    <div class="flex items-center mb-2">
                        <span class="inline-block w-2 h-2 rounded-full mr-2 ${statusColor}"></span>
                        <span class="text-sm">${node.online ? 'Online' : 'Offline'}</span>
                    </div>
                    <div class="mb-3">
                        <div class="text-xs text-gray-400 mb-1">CPU</div>
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-blue-600 h-2 rounded-full transition-width" style="width: ${Math.min(node.cpuPercent ?? 0, 100)}%"></div>
                        </div>
                        <span class="text-xs text-gray-300 metric-value">${(node.cpuPercent ?? 0).toFixed(1)}%</span>
                    </div>
                    <div class="mb-3">
                        <div class="text-xs text-gray-400 mb-1">Mem</div>
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-green-600 h-2 rounded-full transition-width" style="width: ${Math.min(node.memPercent ?? 0, 100)}%"></div>
                        </div>
                        <span class="text-xs text-gray-300 metric-value">${(node.memUsedMB ?? 0)}MB / ${(node.memTotalMB ?? 0)}MB</span>
                    </div>
                    <div class="mb-3">
                        <div class="text-xs text-gray-400 mb-1">Disk</div>
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-yellow-600 h-2 rounded-full transition-width" style="width: ${Math.min((node.diskUsedGB ?? 0) / (node.diskTotalGB ?? 1) * 100, 100)}%"></div>
                        </div>
                        <span class="text-xs text-gray-300 metric-value">${node.diskUsedGB ?? 0}GB / ${node.diskTotalGB ?? 1}GB</span>
                    </div>
                    <div class="mb-3">
                        <div class="text-xs text-gray-400 mb-1">Tags</div>
                        <div class="flex flex-wrap gap-1">
                            ${tagsHTML}
                        </div>
                    </div>
                    <button class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-1 px-3 rounded text-sm w-full" onclick="openTerminal('${node.id}')">>_ WebSSH Terminal</button>
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1 px-3 rounded text-sm w-full mt-1" onclick="editNodeTags('${node.id}', '${JSON.stringify(node.tags || [])}')">Edit Tags</button>
                </div>
            `;
        };

        // Fetch nodes and update UI
        async function fetchNodes() {
            try {
                const response = await apiFetch('/api/v1/nodes');
                if (!response.ok) return;
                const nodes = await response.json();
                nodesContainer.innerHTML = '';

                for (const node of nodes) {
                    if (node.online) {
                        try {
                            const metricsResponse = await apiFetch(`/api/v1/nodes/${node.id}/metrics`);
                            if (metricsResponse.ok) {
                                const metrics = await metricsResponse.json();
                                node.cpuPercent = metrics.cpuPercent ?? node.cpuPercent;
                                node.memPercent = metrics.memPercent ?? node.memPercent;
                                node.diskUsedGB = metrics.diskUsedGB ?? node.diskUsedGB;
                                node.diskTotalGB = metrics.diskTotalGB ?? node.diskTotalGB;
                                node.memUsedMB = metrics.memUsedMB ?? node.memUsedMB;
                                node.memTotalMB = metrics.memTotalMB ?? node.memTotalMB;
                            }
                        } catch (e) {
                            console.warn('Failed to fetch metrics for node:', node.id, e);
                        }
                    }
                    nodesContainer.innerHTML += nodeTemplate(node);
                }
            } catch (error) {
                console.error('Error fetching nodes:', error);
            }
        }

        // Generate new node token
        document.getElementById('generate-token').addEventListener('click', async () => {
            try {
                // Resolve the real Agent endpoint first. Do not mint a token if this fails.
                const infoResponse = await apiFetch('/api/v1/server-info');
                if (!infoResponse.ok) throw new Error(`Server configuration request failed (HTTP ${infoResponse.status}). Check the admin password and try again.`);
                const info = await infoResponse.json();
                const serverURL = info.server_url;
                if (!serverURL) throw new Error('The Fleet Agent server URL is not configured.');

                const response = await apiFetch('/api/v1/tokens', { method: 'POST' });
                if (!response.ok) throw new Error(`Token creation failed (HTTP ${response.status}): ${await response.text()}`);
                const data = await response.json();
                const token = data.bootstrap_token;
                if (!token) throw new Error('The server response did not contain a bootstrap token.');
                
                const installCommand = `curl -fsSL "${serverURL}/install.sh?token=${encodeURIComponent(token)}" | sudo sh`;
                const debugCommand = `go run ./cmd/agent -server "${serverURL}" -bootstrap "${token}"`;

                // Replace the old browser alert with a usable installation dialog.
                document.getElementById('fleet-install-dialog')?.remove();
                const dialog = document.createElement('div');
                dialog.id = 'fleet-install-dialog';
                dialog.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4';
                dialog.innerHTML = `
                  <section role="dialog" aria-modal="true" aria-labelledby="fleet-install-title"
                    class="w-full max-w-2xl rounded-2xl border border-gray-700 bg-gray-900 p-6 shadow-2xl">
                    <div class="mb-5 flex items-start justify-between gap-4">
                      <div>
                        <div class="mb-2 inline-flex items-center rounded-full bg-emerald-500/10 px-3 py-1 text-xs font-semibold text-emerald-300">NODE TOKEN CREATED</div>
                        <h2 id="fleet-install-title" class="text-2xl font-bold text-white">Install a Fleet Agent</h2>
                        <p class="mt-1 text-sm text-gray-400">Run this command on the Linux machine you want to manage.</p>
                      </div>
                      <button id="fleet-install-close" aria-label="Close" class="rounded-lg px-3 py-1 text-2xl text-gray-400 hover:bg-gray-800 hover:text-white">&times;</button>
                    </div>
                    <div class="mb-4 rounded-xl border border-gray-700 bg-gray-800/70 p-4">
                      <div class="mb-2 flex items-center justify-between gap-3">
                        <h3 class="font-semibold text-white">Production installation</h3>
                        <button id="fleet-copy-install" class="rounded-lg bg-blue-600 px-3 py-2 text-sm font-semibold text-white hover:bg-blue-500">Copy command</button>
                      </div>
                      <pre class="overflow-x-auto whitespace-pre-wrap break-all rounded-lg bg-gray-950 p-3 text-sm leading-6 text-emerald-300"><code id="fleet-install-command"></code></pre>
                      <p class="mt-2 text-xs text-gray-400">Requires Linux, curl, sudo, and Tailscale connectivity to this Fleet server.</p>
                    </div>
                    <details class="mb-4 rounded-xl border border-gray-700 p-4">
                      <summary class="cursor-pointer text-sm font-semibold text-gray-300">Local development command</summary>
                      <pre class="mt-3 overflow-x-auto whitespace-pre-wrap break-all rounded-lg bg-gray-950 p-3 text-sm text-gray-300"><code id="fleet-debug-command"></code></pre>
                      <button id="fleet-copy-debug" class="mt-2 rounded-lg border border-gray-600 px-3 py-2 text-sm text-gray-200 hover:bg-gray-800">Copy development command</button>
                    </details>
                    <div class="flex flex-wrap items-center justify-between gap-3 border-t border-gray-800 pt-4">
                      <p class="max-w-md text-xs text-amber-300">This one-time token expires in 1 hour. Keep it private.</p>
                      <button id="fleet-install-done" class="rounded-lg bg-gray-700 px-4 py-2 text-sm font-semibold text-white hover:bg-gray-600">Done</button>
                    </div>
                    <p id="fleet-copy-status" role="status" class="mt-3 min-h-5 text-right text-xs text-emerald-300"></p>
                  </section>`;
                document.body.appendChild(dialog);
                document.getElementById('fleet-install-command').textContent = installCommand;
                document.getElementById('fleet-debug-command').textContent = debugCommand;
                const closeDialog = () => dialog.remove();
                document.getElementById('fleet-install-close').addEventListener('click', closeDialog);
                document.getElementById('fleet-install-done').addEventListener('click', closeDialog);
                dialog.addEventListener('click', event => { if (event.target === dialog) closeDialog(); });
                const copyCommand = async command => {
                    try {
                        await navigator.clipboard.writeText(command);
                        document.getElementById('fleet-copy-status').textContent = 'Copied to clipboard.';
                    } catch (error) {
                        document.getElementById('fleet-copy-status').textContent = 'Clipboard unavailable. Select and copy the command manually.';
                    }
                };
                document.getElementById('fleet-copy-install').addEventListener('click', () => copyCommand(installCommand));
                document.getElementById('fleet-copy-debug').addEventListener('click', () => copyCommand(debugCommand));
            } catch (error) {
                console.error('Error generating token:', error);
                document.getElementById('fleet-error-dialog')?.remove();
                const failure = document.createElement('div');
                failure.id = 'fleet-error-dialog';
                failure.className = 'fixed inset-0 z-[60] flex items-center justify-center bg-black/80 p-4';
                failure.innerHTML = `
                  <section role="alertdialog" aria-modal="true" aria-labelledby="fleet-error-title"
                    class="w-full max-w-lg rounded-2xl border border-red-500/40 bg-gray-900 p-6 shadow-2xl">
                    <div class="mb-3 flex items-center gap-3">
                      <span class="flex h-10 w-10 items-center justify-center rounded-full bg-red-500/10 text-xl text-red-300">!</span>
                      <h2 id="fleet-error-title" class="text-xl font-bold text-white">Could not create node token</h2>
                    </div>
                    <p class="text-sm leading-6 text-gray-300" id="fleet-error-message"></p>
                    <div class="mt-5 flex justify-end">
                      <button id="fleet-error-close" class="rounded-lg bg-gray-700 px-4 py-2 text-sm font-semibold text-white hover:bg-gray-600">Close</button>
                    </div>
                  </section>`;
                document.body.appendChild(failure);
                document.getElementById('fleet-error-message').textContent = error.message || 'An unexpected error occurred.';
                document.getElementById('fleet-error-close').addEventListener('click', () => failure.remove());
                failure.addEventListener('click', event => { if (event.target === failure) failure.remove(); });
            }
        });

        // Terminal functionality
        let terminal = null;
        let socket = null;

        function openTerminal(nodeId) {
            const modal = document.getElementById('terminal-modal');
            modal.classList.remove('hidden');

            if (!terminal) {
                terminal = new Terminal({
                    cursorBlink: true,
                    theme: {
                        background: '#1a1a1a',
                        foreground: '#ffffff'
                    }
                });
                const fitAddon = new FitAddon.FitAddon();
                terminal.loadAddon(fitAddon);
                terminal.open(document.getElementById('terminal'));
                fitAddon.fit();

                terminal.onData((data) => {
                    if (socket) {
                        socket.send(data);
                    }
                });
            }

            // Connect to WebSocket with token or admin key if applicable
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            socket = new WebSocket(`${protocol}//${host}/api/v1/nodes/${nodeId}/pty`);

            socket.onopen = () => {
                terminal.write('\r\nConnected to node terminal\r\n');
            };

            socket.onmessage = (event) => {
                terminal.write(event.data);
            };

            socket.onclose = () => {
                terminal.write('\r\nDisconnected from terminal\r\n');
            };
        }

        document.getElementById('close-terminal').addEventListener('click', () => {
            if (socket) {
                socket.close();
                socket = null;
            }
            document.getElementById('terminal-modal').classList.add('hidden');
        });

        // DNS Providers CRUD
        async function fetchDNSProviders() {
            try {
                const response = await apiFetch('/api/v1/dns-providers');
                if (!response.ok) return;
                const providers = await response.json();
                renderDNSProviders(providers);
            } catch (error) {
                console.error('Error fetching DNS providers:', error);
            }
        }

        function renderDNSProviders(providers) {
            console.log('DNS Providers:', providers);
        }

        // Edit node tags
        function editNodeTags(nodeId, currentTags) {
            const tagsInput = prompt('Enter tags separated by comma:', currentTags ? currentTags.join(', ') : '');
            if (tagsInput === null) return;
            
            const tags = tagsInput.split(',').map(t => t.trim()).filter(t => t.length > 0);
            
            apiFetch(`/api/v1/nodes/${nodeId}/tags`, {
                method: 'PUT',
                body: JSON.stringify({ tags })
            }).then(res => res.json()).then(data => {
                fetchNodes();
            }).catch(err => {
                console.error('Error updating tags:', err);
            });
        }

        // Keepalive config
        function toggleKeepalive(nodeId, enabled) {
            apiFetch(`/api/v1/nodes/${nodeId}/keepalive`, {
                method: 'POST',
                body: JSON.stringify({ enabled })
            });
        }

        // Initial load
        fetchNodes();
        setInterval(fetchNodes, 3000);
    </script>
</body>
</html>
